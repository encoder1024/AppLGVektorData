services:
  timescaledb:
    image: timescale/timescaledb-ha:pg14-latest # Imagen oficial de TimescaleDB
    container_name: timescaledb-lgvektor
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
    networks:
      - mynetwork

  app:
    build: .
    container_name: node-app-lgvektor
    ports:
      - "5173:5173" # Asegúrate de que el puerto coincide con el que expone Vite
    environment:
      DB_HOST: ${VITE_DB_HOST}
      DB_USER: ${VITE_DB_USER}
      DB_PASSWORD: ${VITE_DB_PASSWORD}
      DB_NAME: ${VITE_DB_NAME}
    depends_on:
      - timescaledb
    networks:
      - mynetwork

volumes:
  tsdata:

networks:
  mynetwork:
